<!DOCTYPE html>
<html>
<head>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/Observer.min.js"></script>
</head>
<body style="height: 300vh; margin: 0; background: #222; color: #fff; font-family: sans-serif; padding: 20px;">
  <h2>GSAP Observer Test</h2>
  <div id="log" style="font-size: 18px; white-space: pre-wrap;"></div>
  <script>
    const log = document.getElementById('log');
    function print(msg) {
      log.innerText = msg + '\n' + log.innerText;
    }
    Observer.create({
      target: window,
      type: 'wheel,touch',
      preventDefault: true,
      onDown: (self) => print('ON_DOWN: deltaY=' + self.deltaY + ' isDragging=' + self.isDragging),
      onUp: (self) => print('ON_UP: deltaY=' + self.deltaY + ' isDragging=' + self.isDragging),
      onChangeY: (self) => print('CHANGE_Y: deltaY=' + self.deltaY)
    });
  </script>
</body>
</html>
